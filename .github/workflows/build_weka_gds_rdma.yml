name: Build Weka Wheels

# Triggered on:
#   - Any push/merge to feat/weka-gds-rdma (the main Weka integration branch)
#   - PRs from feat/weka* branches targeting feat/weka-gds-rdma (as a gating check)
on:
  push:
    branches:
      - feat/weka-gds-rdma
  pull_request:
    branches:
      - feat/weka-gds-rdma

env:
  LC_ALL: en_US.UTF-8
  # Pass the computed Weka version from the host into the cibuildwheel container.
  # CUDA_HOME is NOT passed from the host — it is set directly inside the container
  # via CIBW_ENVIRONMENT_LINUX because /usr/local/cuda is a fixed path in all
  # pytorch manylinux builder images and does not need host-side detection.
  CIBW_ENVIRONMENT_PASS_LINUX: "SETUPTOOLS_SCM_PRETEND_VERSION"

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  build-wheels:
    name: Build CUDA ARM64 wheels
    runs-on: self-hosted

    # For pull_request events: only run if the source branch is a feat/weka* branch.
    # For push events: github.head_ref is empty, so the condition passes through.
    if: github.event_name == 'push' || startsWith(github.head_ref, 'feat/weka')

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Fetch upstream tags for version detection
        # Fetches from two remotes:
        #   1. origin (weka/lmcache) — picks up weka-v* base tags
        #   2. upstream (LMCache/LMCache) — gets canonical v0.x.y release tags
        #      Only tags are fetched (refs/tags/*:refs/tags/*), no branches,
        #      so upstream/dev never conflicts with origin/dev.
        #
        # Tagging convention — after each rebase onto upstream vX.Y.Z, run:
        #   git tag weka-v0.3.14 && git push origin weka-v0.3.14
        # The workflow then produces version: 0.3.14+weka.<commits-since-tag>
        run: |
          git fetch origin --tags
          git remote add upstream https://github.com/LMCache/LMCache.git 2>/dev/null || git remote set-url upstream https://github.com/LMCache/LMCache.git
          git fetch upstream 'refs/tags/*:refs/tags/*' --no-recurse-submodules

      - name: Compute Weka version
        id: version
        run: |
          # Find the most recent weka-v* tag reachable from HEAD.
          # This tag is created manually after each upstream rebase (see above).
          WEKA_BASE_TAG=$(git describe --tags --match "weka-v*" --abbrev=0 2>/dev/null || echo "")

          if [ -n "$WEKA_BASE_TAG" ]; then
            # Strip "weka-v" prefix to get the upstream version number (e.g. "0.3.14")
            UPSTREAM_VERSION="${WEKA_BASE_TAG#weka-v}"
            # Count commits added by Weka on top of this tag
            WEKA_COMMITS=$(git rev-list "${WEKA_BASE_TAG}..HEAD" --count)
          else
            # Fallback: no weka-v* tag found — use 0.0.0 and total commit count
            echo "::warning::No weka-v* tag found. Create one after each upstream rebase (e.g. git tag weka-v0.3.14)."
            UPSTREAM_VERSION="0.0.0"
            WEKA_COMMITS=$(git rev-list HEAD --count)
          fi

          WEKA_VERSION="${UPSTREAM_VERSION}+weka.${WEKA_COMMITS}"
          echo "weka_version=${WEKA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${WEKA_VERSION}" >> "$GITHUB_ENV"
          echo "Building version: ${WEKA_VERSION}"

      - name: Setup Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build cibuildwheel

      - name: Build CUDA wheels (manylinux_aarch64, CUDA 12.8)
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ env.SETUPTOOLS_SCM_PRETEND_VERSION }}
          # Override pyproject.toml [tool.cibuildwheel] defaults (which target x86_64)
          CIBW_BUILD: "cp312-manylinux_aarch64"
          CIBW_MANYLINUX_AARCH64_IMAGE: "docker.io/pytorch/manylinuxaarch64-builder:cuda12.8"
          # Set environment variables directly inside the container.
          # CIBW_ENVIRONMENT_LINUX overrides pyproject.toml's [tool.cibuildwheel] environment,
          # so all required vars must be listed here explicitly.
          # CUDA_HOME is hardcoded to /usr/local/cuda — the fixed path used by all
          # pytorch manylinux builder images (NVIDIA installs CUDA there by convention).
          # SETUPTOOLS_SCM_PRETEND_VERSION is expanded from the host via CIBW_ENVIRONMENT_PASS_LINUX.
          CIBW_ENVIRONMENT_LINUX: >-
            TORCH_CUDA_ARCH_LIST="7.0;7.5;8.0;8.6;8.9;9.0;10.0"
            ENABLE_CXX11_ABI="1"
            CUDA_HOME="/usr/local/cuda"
            SETUPTOOLS_SCM_PRETEND_VERSION="$SETUPTOOLS_SCM_PRETEND_VERSION"
          # Specifies the command to run after building a Linux wheel to repair it.
          # This command is used by cibuildwheel to make the wheel compatible with different Linux distributions
          # by bundling external shared libraries into the wheel using tools like auditwheel.
          # Pre-install build requirements so --no-isolation works.
          # torch==2.8.0 is large but pip caches it on the self-hosted runner.
          CIBW_BEFORE_BUILD: "pip install ninja 'packaging>=24.2' 'setuptools>=77.0.3,<81.0.0' 'setuptools_scm>=8' 'torch==2.8.0' wheel"
          # Skip build isolation so setup.py runs in the container's main Python
          # process, where CUDA_HOME (and all other env vars) are inherited directly.
          # With isolation, pip reconstructs the subprocess environment and strips
          # custom vars like CUDA_HOME before invoking the build backend.
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair
            --plat manylinux_2_28_aarch64
            --exclude libtorch.so
            --exclude libtorch_cuda.so
            --exclude libtorch_python.so
            --exclude libtorch_cpu.so
            --exclude libc10.so
            --exclude libc10_cuda.so
            --exclude libcudart.so.12
            -w {dest_dir} {wheel}
        run: |
          rm -rf dist/
          python -m cibuildwheel --output-dir dist

      # PRs: upload as a temporary artifact for inspection (auto-deleted after 30 days)
      - name: Upload PR artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: weka-wheels-${{ steps.version.outputs.weka_version }}-${{ github.run_id }}
          path: dist/*.whl
          retention-days: 30

      # Merges: create a versioned GitHub Release and attach the wheels permanently.
      # Release tag uses '-' instead of '+' since '+' is not valid in git ref names
      # (e.g. v0.3.14-weka.33), but the wheel filename retains the canonical PEP 440
      # version with '+' (e.g. lmcache-0.3.14+weka.33-cp312-...-manylinux_2_28_aarch64.whl).
      - name: Create GitHub Release with wheels
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEKA_VERSION: ${{ steps.version.outputs.weka_version }}
        run: |
          RELEASE_TAG="v${WEKA_VERSION//+/-}"
          gh release create "${RELEASE_TAG}" dist/*.whl \
            --repo "${{ github.repository }}" \
            --title "Weka LMCache ${WEKA_VERSION}" \
            --notes "ARM64 / CUDA 12.8 wheels for lmcache ${WEKA_VERSION}"
