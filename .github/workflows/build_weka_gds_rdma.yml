name: Build and Test Weka Wheels

# Triggered on:
#   - Any push/merge to feat/weka-gds-rdma (the main Weka integration branch)
#   - PRs from feat/weka* branches targeting feat/weka-gds-rdma (as a gating check)
on:
  push:
    branches:
      - feat/weka-gds-rdma
  pull_request:
    branches:
      - feat/weka-gds-rdma

permissions:
  contents: write

jobs:
  build-wheels:
    name: Build wheels
    # For pull_request events: only run if the source branch is a feat/weka* branch.
    # For push events: github.head_ref is empty, so the condition passes through.
    if: github.event_name == 'push' || startsWith(github.head_ref, 'feat/weka')
    
    strategy:
      matrix:
        include:
          - arch: aarch64
            runner: self-hosted
            cibw_build: cp312-manylinux_aarch64
            cibw_image: docker.io/pytorch/manylinuxaarch64-builder:cuda13.0
            plat: manylinux_2_28_aarch64

    uses: ./.github/workflows/_build_weka_wheel.yml
    with:
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      cibw_build: ${{ matrix.cibw_build }}
      cibw_image: ${{ matrix.cibw_image }}
      plat: ${{ matrix.plat }}

  test:
    name: Run unit tests (native)
    needs: build-wheels
    runs-on: self-hosted
    env:
      VENV_PATH: ${{ github.workspace }}/.venv-test
      CUDA_HOME: /usr/local/cuda
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cu130

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Download wheel artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: weka-wheel-*
          merge-multiple: true
          path: dist

      - name: Create virtual environment and install dependencies
        run: |
          # Use system Python 3.12 to create venv
          python3.12 -m venv "$VENV_PATH"
          
          # Activate and install
          source "$VENV_PATH/bin/activate"
          
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1+cu130 --extra-index-url https://download.pytorch.org/whl/cu130
          
          # Install the wheel with verbose output to debug
          echo "Available wheels in dist/:"
          ls -la dist/
          
          # Force reinstall and show what's being installed
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip install -r requirements/test.txt
          
          # Set up library paths - need PyTorch's lib dir for libc10.so
          TORCH_LIB=$(python -c "import torch; print(torch.__path__[0] + '/lib')")
          export LD_LIBRARY_PATH=$TORCH_LIB:/usr/local/cuda/lib64:$LD_LIBRARY_PATH
          
          # Verify installation from /tmp to avoid importing from source checkout
          cd /tmp
          python --version
          python -c "import torch; print(f'PyTorch {torch.__version__}')"
          python -c "import lmcache; print(f'LMCache installed from: {lmcache.__file__}')"
          python -c "from lmcache import c_ops; print('c_ops loaded successfully')"

      - name: Run tests natively
        run: |
          source "$VENV_PATH/bin/activate"
          
          # Set up library paths - need PyTorch's lib dir for libc10.so
          TORCH_LIB=$(python -c "import torch; print(torch.__path__[0] + '/lib')")
          export LD_LIBRARY_PATH=$TORCH_LIB:/usr/local/cuda/lib64:$LD_LIBRARY_PATH
          
          # Copy tests to temp directory to avoid importing from source checkout
          TEST_DIR=$(mktemp -d)
          cp -r tests "$TEST_DIR/"
          cd "$TEST_DIR"
          
          mkdir -p durations
          
          python -m pytest \
            --maxfail=1 \
            --cov=lmcache \
            --cov-report term \
            --cov-report=html:coverage-test \
            --cov-report=xml:coverage-test.xml \
            --html=durations/test.html \
            --ignore=tests/disagg \
            --ignore=tests/v1/test_pos_kernels.py \
            --ignore=tests/v1/test_nixl_storage.py \
            --ignore=tests/skipped \
            --ignore=tests/v1/multiprocess \
            --ignore=tests/v1/storage_backend/test_eic.py \
            tests/
          
          # Copy results back to workspace
          cp -r coverage-test coverage-test.xml durations "${{ github.workspace }}/" 2>/dev/null || true

      - name: Cleanup virtual environment
        if: always()
        run: rm -rf "$VENV_PATH"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-results-${{ needs.build-wheels.outputs.weka_version }}-${{ github.run_id }}
          path: |
            coverage-test/
            coverage-test.xml
            durations/test.html
          retention-days: 30

  publish:
    name: Publish wheels
    needs: [build-wheels, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: weka-wheel-*
          merge-multiple: true
          path: dist

      # PRs: upload as a temporary artifact for inspection (auto-deleted after 30 days)
      - name: Upload PR artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: weka-wheels-${{ needs.build-wheels.outputs.weka_version }}-${{ github.run_id }}
          path: dist/*.whl
          retention-days: 30

      # Merges: create a versioned GitHub Release and attach the wheels permanently.
      # Release tag uses '-' instead of '+' since '+' is not valid in git ref names
      # (e.g. v0.3.14-weka.33), but the wheel filename retains the canonical PEP 440
      # version with '+' (e.g. lmcache-0.3.14+weka.33-cp312-...-manylinux_2_28_aarch64.whl).
      - name: Create GitHub Release with wheels
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEKA_VERSION: ${{ needs.build-wheels.outputs.weka_version }}
        run: |
          RELEASE_TAG="v${WEKA_VERSION//+/-}"
          gh release create "${RELEASE_TAG}" dist/*.whl \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Weka LMCache ${WEKA_VERSION}" \
            --notes "CUDA 13.0 wheels for lmcache ${WEKA_VERSION} (torch 2.9.1+cu130, Python 3.12)"
