name: Build Weka Wheels

# Triggered on:
#   - Any push/merge to feat/weka-gds-rdma (the main Weka integration branch)
#   - PRs from feat/weka* branches targeting feat/weka-gds-rdma (as a gating check)
on:
  push:
    branches:
      - feat/weka-gds-rdma
  pull_request:
    branches:
      - feat/weka-gds-rdma

env:
  LC_ALL: en_US.UTF-8
  # Pass the computed Weka version into the cibuildwheel Docker container
  CIBW_ENVIRONMENT_PASS_LINUX: SETUPTOOLS_SCM_PRETEND_VERSION

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  build-wheels:
    name: Build CUDA wheels (${{ matrix.arch }}, CUDA 13.0)
    runs-on: ${{ matrix.runner }}

    # For pull_request events: only run if the source branch is a feat/weka* branch.
    # For push events: github.head_ref is empty, so the condition passes through.
    if: github.event_name == 'push' || startsWith(github.head_ref, 'feat/weka')

    strategy:
      matrix:
        include:
          - arch: aarch64
            runner: self-hosted
            cibw_build: cp312-manylinux_aarch64
            cibw_image: docker.io/pytorch/manylinuxaarch64-builder:cuda13.0
            plat: manylinux_2_28_aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Fetch upstream tags for version detection
        # Fetches upstream (LMCache/LMCache) tags to automatically determine the base
        # version. Only tags are fetched (refs/tags/*:refs/tags/*), no branches.
        # The version computation finds the most recent upstream v* tag reachable from
        # HEAD and counts commits since then: 0.3.14+weka.<commits-since-v0.3.14>
        run: |
          git fetch origin --tags
          git remote add upstream https://github.com/LMCache/LMCache.git 2>/dev/null || git remote set-url upstream https://github.com/LMCache/LMCache.git
          git fetch upstream 'refs/tags/*:refs/tags/*' --no-recurse-submodules

      - name: Compute Weka version
        id: version
        run: |
          # Find the most recent upstream v* tag reachable from HEAD.
          # Exclude CI-generated v*-weka* tags to find the true upstream base version.
          UPSTREAM_TAG=$(git describe --tags --match "v*" --exclude "v*-weka*" --abbrev=0 2>/dev/null || echo "")

          if [ -n "$UPSTREAM_TAG" ]; then
            # Strip "v" prefix to get the upstream version number (e.g. "0.3.14")
            UPSTREAM_VERSION="${UPSTREAM_TAG#v}"
            # Count commits added by Weka on top of this upstream tag
            WEKA_COMMITS=$(git rev-list "${UPSTREAM_TAG}..HEAD" --count)
          else
            # Fallback: no upstream v* tag found — use 0.0.0 and total commit count
            echo "::warning::No upstream v* tag found. Using fallback version."
            UPSTREAM_VERSION="0.0.0"
            WEKA_COMMITS=$(git rev-list HEAD --count)
          fi

          WEKA_VERSION="${UPSTREAM_VERSION}+weka.${WEKA_COMMITS}"
          echo "weka_version=${WEKA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${WEKA_VERSION}" >> "$GITHUB_ENV"
          echo "Building version: ${WEKA_VERSION}"

      - name: Setup Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build cibuildwheel

      - name: Build CUDA wheels (${{ matrix.arch }}, CUDA 13.0)
        # Base config is in pyproject.toml [tool.cibuildwheel] (targets x86_64 for the
        # upstream publish workflow). The env vars below override it for this ARM64 runner.
        # SETUPTOOLS_SCM_PRETEND_VERSION is injected into the container via
        # CIBW_ENVIRONMENT_PASS_LINUX, overriding automatic version detection.
        #
        # CUDA 13.0 notes:
        #   - torch==2.8.0 on PyPI is CPU-only for aarch64; CUDA 13-enabled wheels start
        #     at torch>=2.9.0 on PyTorch's own index (download.pytorch.org/whl/cu130).
        #     CIBW_BEFORE_ALL_LINUX patches pyproject.toml inside the container so the
        #     isolated build env installs the correct CUDA-enabled wheel.
        #   - CUDA 13.0 dropped sm_70 (V100); TORCH_CUDA_ARCH_LIST starts at 7.5.
        #   - libcudart.so major version bumped from 12 → 13.
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ env.SETUPTOOLS_SCM_PRETEND_VERSION }}
          # Override build target from matrix
          CIBW_BUILD: ${{ matrix.cibw_build }}
          # PyTorch manylinux builder image with CUDA 13.0
          CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.cibw_image }}
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.cibw_image }}
          # Patch pyproject.toml inside the container to use a CUDA 13-enabled torch.
          # This only affects the container copy; the source repo is untouched.
          CIBW_BEFORE_ALL_LINUX: >-
            sed -i 's/torch==2.8.0/torch==2.9.1+cu130/'
            /project/pyproject.toml
          # Environment passed into the build container:
          #   - PIP_EXTRA_INDEX_URL: lets pip find torch==2.9.1+cu130 from PyTorch's index
          #   - CUDA_HOME: explicit fallback in case the container ENV is not inherited
          #   - TORCH_CUDA_ARCH_LIST: sm_70 removed (unsupported by CUDA 13.0)
          CIBW_ENVIRONMENT: >-
            TORCH_CUDA_ARCH_LIST="7.5;8.0;8.6;8.9;9.0;10.0"
            ENABLE_CXX11_ABI="1"
            CUDA_HOME="/usr/local/cuda"
            PIP_EXTRA_INDEX_URL="https://download.pytorch.org/whl/cu130"
          # Repair wheel using platform from matrix
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair
            --plat ${{ matrix.plat }}
            --exclude libtorch.so
            --exclude libtorch_cuda.so
            --exclude libtorch_python.so
            --exclude libtorch_cpu.so
            --exclude libc10.so
            --exclude libc10_cuda.so
            --exclude libcudart.so.13
            -w {dest_dir} {wheel}
        run: |
          rm -rf dist/
          python -m cibuildwheel --output-dir dist

      # PRs: upload as a temporary artifact for inspection (auto-deleted after 30 days)
      - name: Upload PR artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: weka-wheels-${{ steps.version.outputs.weka_version }}-${{ github.run_id }}
          path: dist/*.whl
          retention-days: 30

      # Merges: create a versioned GitHub Release and attach the wheels permanently.
      # Release tag uses '-' instead of '+' since '+' is not valid in git ref names
      # (e.g. v0.3.14-weka.33), but the wheel filename retains the canonical PEP 440
      # version with '+' (e.g. lmcache-0.3.14+weka.33-cp312-...-manylinux_2_28_aarch64.whl).
      - name: Create GitHub Release with wheels
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEKA_VERSION: ${{ steps.version.outputs.weka_version }}
        run: |
          RELEASE_TAG="v${WEKA_VERSION//+/-}"
          gh release create "${RELEASE_TAG}" dist/*.whl \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Weka LMCache ${WEKA_VERSION}" \
            --notes "${{ matrix.arch }} / CUDA 13.0 wheels for lmcache ${WEKA_VERSION} (torch 2.9.1+cu130, Python 3.12)"
