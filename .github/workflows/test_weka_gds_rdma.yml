name: Test Weka Wheels

# Triggered on:
#   - Any push/merge to feat/weka-gds-rdma (the main Weka integration branch)
#   - PRs from feat/weka* branches targeting feat/weka-gds-rdma (as a gating check)
on:
  push:
    branches:
      - feat/weka-gds-rdma
  pull_request:
    branches:
      - feat/weka-gds-rdma

env:
  LC_ALL: en_US.UTF-8

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels for testing
    # For pull_request events: only run if the source branch is a feat/weka* branch.
    # For push events: github.head_ref is empty, so the condition passes through.
    if: github.event_name == 'push' || startsWith(github.head_ref, 'feat/weka')
    
    strategy:
      matrix:
        include:
          - arch: aarch64
            runner: self-hosted
            cibw_build: cp312-manylinux_aarch64
            cibw_image: docker.io/pytorch/manylinuxaarch64-builder:cuda13.0
            plat: manylinux_2_28_aarch64

    uses: ./.github/workflows/_build_weka_wheel.yml
    with:
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      cibw_build: ${{ matrix.cibw_build }}
      cibw_image: ${{ matrix.cibw_image }}
      plat: ${{ matrix.plat }}

  test:
    name: Run unit tests
    needs: build-wheels
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Download wheel artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: weka-wheel-*
          merge-multiple: true
          path: dist

      - name: Setup Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - name: Install wheel and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
          pip install -r requirements/test.txt

      - name: Run pytest
        run: |
          pytest \
            --maxfail=1 \
            --cov=lmcache \
            --cov-report term \
            --cov-report=html:coverage-test \
            --cov-report=xml:coverage-test.xml \
            --html=durations/test.html \
            --ignore=tests/disagg \
            --ignore=tests/v1/test_pos_kernels.py \
            --ignore=tests/v1/test_nixl_storage.py \
            --ignore=tests/skipped \
            --ignore=tests/v1/multiprocess \
            --ignore=tests/v1/storage_backend/test_eic.py \
            tests/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-results-${{ needs.build-wheels.outputs.weka_version }}-${{ github.run_id }}
          path: |
            coverage-test/
            coverage-test.xml
            durations/test.html
          retention-days: 30
